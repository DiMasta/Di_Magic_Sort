<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Sort</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="game-header">
      <a class="button" href="index.html" aria-label="Back to levels">&larr; Levels</a>
      <h1 id="title">Level</h1>
      <span class="moves" id="moves">0 moves</span>
    </header>

    <div class="board" id="board"></div>

    <div class="controls">
      <button id="undo">Undo</button>
      <button id="restart">Restart</button>
      <button id="extra">+1 Tube</button>
    </div>
    <p class="message" id="message"></p>
  </main>

  <div class="overlay" id="win" hidden>
    <div class="dialog">
      <h2>Well done!</h2>
      <p id="win-text"></p>
      <div class="controls">
        <a class="button" href="index.html">Levels</a>
        <a class="button primary" id="next" href="#">Next level</a>
      </div>
    </div>
  </div>

  <script src="js/rules.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
